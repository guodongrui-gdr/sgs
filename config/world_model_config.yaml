global:
  device: cuda
  n_agents: 5
  use_mappo: false
  use_world_model: false
hyperparameters:
  checkpoint_dir: checkpoints
  checkpoint_interval: 5000
  eval_interval: 1000
  evidence_dir: .sisyphus/evidence
  gae_lambda: 0.95
  gamma: 0.99
  log_dir: train/logs
  log_interval: 100
  max_grad_norm: 0.5
  mini_batch_size: 64
  ppo_epochs: 4
phase0:
  baseline_steps: 10000
  ippo_global_enabled: true
  mappo_enabled: true
  rollback_alternatives:
  - IPPO+global state (no MAPPO)
  - "Hybrid: MAPPO for \u4E3B\u516C+\u5FE0\u81E3 only"
  - Delay MAPPO until Phase 2
  validation_threshold: 15.0
phase1:
  dynamics:
    action_embed_dim: 64
    error_threshold: 0.1
    gru_layers: 2
    hidden_dim: 256
    uncertainty_enabled: true
  encoder:
    kl_weight: 1.0
    latent_dim: 128
    state_dim: 3066
    use_transformer: true
    vae_enabled: true
  reward:
    error_threshold: 5.0
    hidden_dims:
    - 256
    - 256
    identity_aware: true
  training:
    batch_size: 64
    dynamics_steps: 50000
    learning_rate: 3e-4
    warmup_steps: 10000
phase2:
  imagination:
    divergence_threshold: 0.2
    horizon: 15
    ratio: 0.5
    speedup_target: 100
  quality_validation:
    horizons:
    - 1
    - 5
    - 10
    - 15
    metrics:
    - state_divergence
    - reward_divergence
    - action_validity
phase3:
  actors:
    action_dim: 45
    action_masking: true
    hidden_dim: 256
    local_state_dim: 3066
  critic:
    death_masking: true
    global_state_dim: 15330
    hidden_dim: 256
    identity_aware: true
  team_rewards:
    advantage_decomposition: true
    bonus_multiplier: 2.0
    teams:
      lord_loyal:
      - 0
      - 1
      rebel:
      - 2
      - 3
      spy:
      - 4
  training:
    clip_range: 0.2
    ent_coef: 0.01
    entropy_threshold: 0.01
    learning_rate: 3e-4
    value_std_threshold: 0.01
    vf_coef: 0.5
success_criteria:
  coordination_improvement: 20
  dynamics_error: 0.1
  final_win_rate_vs_ruleai: 85
  imagination_divergence: 0.2
  sample_efficiency_improvement: 2
